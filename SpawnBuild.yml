name: Build SpawnBuild

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project
        run: |
          mkdir -p SpawnBuild/src/main/java/spbuild SpawnBuild/src/main/resources
          cat > SpawnBuild/pom.xml <<'EOF_POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>spbuild</groupId>
            <artifactId>SpawnBuild</artifactId>
            <version>1.0.0</version>
            <packaging>jar</packaging>
            <properties>
              <maven.compiler.source>17</maven.compiler.source>
              <maven.compiler.target>17</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <repositories>
              <repository>
                <id>repo-lanink-cn</id>
                <url>https://repo.lanink.cn/repository/maven-public/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>com.nukkit-mot</groupId>
                <artifactId>nukkit-mot</artifactId>
                <version>1.26.30-R1</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
            <build>
              <finalName>SpawnBuild</finalName>
            </build>
          </project>

          EOF_POM
          cat > SpawnBuild/src/main/resources/plugin.yml <<'EOF_PLUGIN'
          name: SpawnBuild
          main: spbuild.SpawnBuild
          version: 1.0.0
          api: ["1.0.0"]
          load: POSTWORLD
          author: server
          description: Строит готовый спавн в мире командой /spbilid
          commands:
            spbilid:
              description: Построить спавн в мире
              usage: "/spbilid <id мира> [x y z]"
              permission: spbuild.use
          permissions:
            spbuild.use:
              description: Команда /spbilid
              default: op

          EOF_PLUGIN
          cat > SpawnBuild/src/main/java/spbuild/SpawnBuild.java <<'EOF_JAVA'
          package spbuild;

          import cn.nukkit.block.Block;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.level.Level;
          import cn.nukkit.math.Vector3;
          import cn.nukkit.plugin.PluginBase;
          import cn.nukkit.utils.TextFormat;

          import java.io.DataInputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.zip.GZIPInputStream;

          public class SpawnBuild extends PluginBase {

              // Рекомендуемая точка спавна относительно центра постройки (дорожка у южных ворот)
              private static final int SPAWN_DX = 0;
              private static final int SPAWN_DZ = 30;

              private int[] palId = new int[0];
              private int[] palMeta = new int[0];
              private int[] rx = new int[0];
              private int[] ry = new int[0];
              private int[] rz = new int[0];
              private int[] rlen = new int[0];
              private int[] rpal = new int[0];
              private boolean loaded = false;

              @Override
              public void onEnable() {
                  try (InputStream raw = SpawnBuild.class.getResourceAsStream("/spawn.bin")) {
                      if (raw == null) {
                          getLogger().error("spawn.bin не найден внутри плагина");
                          return;
                      }
                      DataInputStream in = new DataInputStream(new GZIPInputStream(raw));
                      int pn = in.readUnsignedShort();
                      palId = new int[pn];
                      palMeta = new int[pn];
                      for (int i = 0; i < pn; i++) {
                          palId[i] = in.readUnsignedShort();
                          palMeta[i] = in.readUnsignedByte();
                      }
                      int rn = in.readInt();
                      rx = new int[rn];
                      ry = new int[rn];
                      rz = new int[rn];
                      rlen = new int[rn];
                      rpal = new int[rn];
                      for (int i = 0; i < rn; i++) {
                          rx[i] = in.readShort();
                          ry[i] = in.readByte();
                          rz[i] = in.readShort();
                          rlen[i] = in.readShort();
                          rpal[i] = in.readUnsignedShort();
                      }
                      loaded = true;
                      getLogger().info("SpawnBuild: данные спавна загружены (" + rn + " отрезков)");
                  } catch (Exception e) {
                      getLogger().error("Не удалось загрузить данные спавна: " + e);
                  }
              }

              private Level findLevel(int id) {
                  if (id == 0) {
                      return getServer().getDefaultLevel();
                  }
                  String name;
                  if (id == 31) {
                      name = "nether";
                  } else if (id == 32) {
                      name = "the_end";
                  } else {
                      name = "mw" + id;
                  }
                  Level level = getServer().getLevelByName(name);
                  if (level == null) {
                      getServer().loadLevel(name);
                      level = getServer().getLevelByName(name);
                  }
                  return level;
              }

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  if (!command.getName().equalsIgnoreCase("spbilid")) {
                      return false;
                  }
                  if (!loaded) {
                      sender.sendMessage(TextFormat.RED + "Данные спавна не загружены, смотри консоль.");
                      return true;
                  }
                  if (args.length != 1 && args.length != 4) {
                      sender.sendMessage(TextFormat.YELLOW + "Использование: /spbilid <id мира> [x y z]");
                      return true;
                  }
                  int id;
                  int ax = 0;
                  int ay = 10;
                  int az = 0;
                  try {
                      id = Integer.parseInt(args[0]);
                      if (args.length == 4) {
                          ax = Integer.parseInt(args[1]);
                          ay = Integer.parseInt(args[2]);
                          az = Integer.parseInt(args[3]);
                      }
                  } catch (NumberFormatException e) {
                      sender.sendMessage(TextFormat.RED + "Айди и координаты должны быть числами.");
                      return true;
                  }
                  if (id < 0 || id > 32) {
                      sender.sendMessage(TextFormat.RED + "Айди мира: от 0 до 32.");
                      return true;
                  }
                  Level level = findLevel(id);
                  if (level == null) {
                      sender.sendMessage(TextFormat.RED + "Мир с айди " + id + " не найден. Сначала создай его (/mwcreate " + id + ").");
                      return true;
                  }

                  sender.sendMessage(TextFormat.YELLOW + "Строю спавн в мире " + id + "...");
                  long start = System.currentTimeMillis();
                  int count = 0;
                  List<int[]> refresh = new ArrayList<>();
                  for (int i = 0; i < rx.length; i++) {
                      int bid = palId[rpal[i]];
                      int meta = palMeta[rpal[i]];
                      boolean shape = bid == 85 || bid == 101 || bid == 107 || bid == 139;
                      for (int j = 0; j < rlen[i]; j++) {
                          int x = ax + rx[i] + j;
                          int y = ay + ry[i];
                          int z = az + rz[i];
                          level.setBlock(new Vector3(x, y, z), Block.get(bid, meta), false, false);
                          count++;
                          if (shape) {
                              refresh.add(new int[]{x, y, z, bid, meta});
                          }
                      }
                  }
                  // второй проход: заборы, стены и решётки получают правильные соединения
                  for (int[] r : refresh) {
                      level.setBlock(new Vector3(r[0], r[1], r[2]), Block.get(r[3], r[4]), true, true);
                  }
                  long ms = System.currentTimeMillis() - start;
                  sender.sendMessage(TextFormat.GREEN + "Готово! Блоков: " + count + " за " + ms + " мс.");
                  sender.sendMessage(TextFormat.GRAY + "Спавн можно поставить так: /setspawn " + id + " "
                          + (ax + SPAWN_DX) + " " + (ay + 1) + " " + (az + SPAWN_DZ));
                  return true;
              }
          }

          EOF_JAVA
